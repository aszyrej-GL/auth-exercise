server.port=8088

spring.application.name=auth-api
spring.jackson.property-naming-strategy=SNAKE_CASE

application.security.jwt.secret-key=${JWT_SECRET_KEY:}
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000

spring.datasource.url=jdbc:h2:mem:bcidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER:local}
spring.datasource.password=${DB_PASS:local}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto= update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
